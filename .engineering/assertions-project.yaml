format: engineering-assertions-project/1
timeout_seconds: 300
commands:
  format:
    executable: env
    args:
      - cargo
      - fmt
      - --all
      - --check
  lint:
    executable: env
    args:
      - cargo
      - clippy
      - --workspace
      - --all-targets
      - --locked
      - --
      - -D
      - warnings
  contracts:
    executable: env
    args:
      - cargo
      - run
      - --locked
      - --quiet
      - -p
      - b10x-tool-contract
      - --
      - validate
      - contracts/
