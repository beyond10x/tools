[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/beyond10x/tools"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
