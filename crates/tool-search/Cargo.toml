[package]
name = "b10x-tool-search"
description = "The search toolset: search.grep, a literal or regular-expression search over one workspace root"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tool_search"

[features]
mutants = []

[dependencies]
b10x-tool-contract = { path = "../tool-contract" }
b10x-tool-fs = { path = "../tool-fs" }
regex = "1.13"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
b10x-tool-search = { path = ".", features = ["mutants"] }
tempfile.workspace = true

[lints]
workspace = true
