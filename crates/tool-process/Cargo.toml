[package]
name = "b10x-tool-process"
description = "The process toolset: process.run, one declared program by argv in one workspace root"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tool_process"

[features]
mutants = []

[dependencies]
b10x-tool-contract = { path = "../tool-contract" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }

[dev-dependencies]
b10x-tool-process = { path = ".", features = ["mutants"] }
tempfile.workspace = true

[lints]
workspace = true
