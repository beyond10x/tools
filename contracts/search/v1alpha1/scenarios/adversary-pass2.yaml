format: tool-conformance/1
toolset: search
version: v1alpha1
scenarios:
  - name: adversary-a-submodules-git-file-below-the-root-is-skipped-too
    holds: [output]
    fixture:
      files:
        vendor/lib/.git: "gitdir: ../../.git/modules/lib needle\n"
        vendor/lib/lib.rs: "needle\n"
        src/target: "needle\n"
        src/one.rs: "needle\n"
    call: {operation: search.grep, input: {pattern: needle}}
    expect:
      outcome: ok
      output:
        matches:
          - {path: src/one.rs, line: 1, text: needle}
          - {path: vendor/lib/lib.rs, line: 1, text: needle}
        truncated: false
      files: {vendor/lib/.git: unchanged, src/target: unchanged}
  - name: adversary-a-skipped-file-below-the-root-named-as-path-is-searched
    holds: [subjects, output]
    fixture:
      files:
        vendor/lib/.git: "gitdir: ../../.git/modules/lib needle\n"
        vendor/lib/lib.rs: "needle\n"
    call: {operation: search.grep, input: {pattern: needle, path: vendor/lib/.git}}
    expect:
      outcome: ok
      output:
        matches:
          - {path: vendor/lib/.git, line: 1, text: "gitdir: ../../.git/modules/lib needle"}
        truncated: false
