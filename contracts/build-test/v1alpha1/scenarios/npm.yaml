format: tool-conformance/1
toolset: build-test
version: v1alpha1
scenarios:
  - name: npm-run-runs-the-named-script
    holds: [effects, idempotency, determinism, bounds, output]
    fixture: {dir: fixtures/npm}
    call:
      operation: build-test.npm_run
      input: {script: hello}
    expect:
      outcome: ok
      output:
        argv: [npm, run, hello]
        exit: 0
        stdout: {$contains: "hello from the npm fixture\n"}
        truncated: false
        timed_out: false
        timeout_ms: 600000
      files:
        package.json: unchanged
  - name: a-script-the-package-does-not-declare-is-refused
    holds: [output]
    fixture: {dir: fixtures/npm}
    call:
      operation: build-test.npm_run
      input: {script: absent}
    expect:
      error: build-test.Refused
      output:
        message: "`script` is not valid for `npm_run`"
