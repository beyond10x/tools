format: tool-conformance/1
toolset: fs
version: v1alpha1
scenarios:
  - name: adversary-a-line-over-two-thousand-characters-is-cut-and-named-by-number
    holds: [bounds, output]
    fixture:
      dir: fixtures/adversary-long-line
    call: {operation: fs.read, input: {path: long.txt}}
    expect:
      outcome: ok
      output:
        bytes: 2507
        text: "     1\\n     2\tshort\n"
        lines: {from: 1, to: 2, total: 2}
        truncated: true
        truncated_lines: [1]
        sha256: {$sha256_of: long.txt}
      files: {long.txt: unchanged}
