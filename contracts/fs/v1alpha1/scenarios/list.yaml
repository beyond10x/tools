  - name: no-path-lists-the-workspace-root
    holds: [subjects, output]
    fixture:
      files: {a.txt: "x"}
    call: {operation: fs.list}
    expect:
      outcome: ok
      output:
        path: ""
        entries:
          - {name: a.txt, kind: file, bytes: 1}
        truncated: false
  - name: listing-a-file-is-not-a-directory
    holds: [output]
    fixture:
      files: {a.txt: "x"}
    call: {operation: fs.list, input: {path: a.txt}}
    expect:
      error: fs.NotADirectory
      output: {path: a.txt}
  - name: listing-a-missing-directory-is-not-found
    holds: [output, subjects]
    fixture:
      files: {a.txt: "x"}
    call: {operation: fs.list, input: {path: missing}}
    expect:
      error: fs.NotFound
      output: {path: missing}
