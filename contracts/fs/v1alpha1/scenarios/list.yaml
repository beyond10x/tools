format: tool-conformance/1
toolset: fs
version: v1alpha1
scenarios:
  - name: a-listing-names-each-entry-with-its-own-kind
    holds: [effects, bounds, paging, subjects, output]
    fixture:
      dir: fixtures/linked
    call: {operation: fs.list, input: {path: "."}}
    expect:
      outcome: ok
      output:
        path: ""
        entries:
          - {name: inner, kind: symlink, bytes: {$absent: true}}
          - {name: own.txt, kind: file, bytes: 4}
          - {name: sub, kind: directory, bytes: {$absent: true}}
          - {name: up, kind: symlink, bytes: {$absent: true}}
        truncated: false
      files: {own.txt: unchanged, inner: unchanged, up: unchanged, sub/keep.txt: unchanged}
  - name: the-same-listing-a-second-time-answers-the-same
    holds: [idempotency, determinism]
    fixture:
      dir: fixtures/linked
    call: {operation: fs.list, input: {path: "."}}
    expect:
      outcome: ok
      output:
        path: ""
        entries:
          - {name: inner, kind: symlink, bytes: {$absent: true}}
          - {name: own.txt, kind: file, bytes: 4}
          - {name: sub, kind: directory, bytes: {$absent: true}}
          - {name: up, kind: symlink, bytes: {$absent: true}}
        truncated: false
  - name: a-listing-over-500-entries-is-truncated-at-500
